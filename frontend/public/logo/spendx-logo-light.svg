    <path d="M312 50H350C373 50 388 64 388 86C388 108 373 122 350 122H336V176H312V50ZM336 102H348C360 102 365 96 365 86C365 76 360 70 348 70H336V102Z" />

    <!-- Letter 'E' (x: 405 -> 465) -->
