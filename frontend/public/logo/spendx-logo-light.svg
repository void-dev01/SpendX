    />
    <!-- Diagonal 2: Top-Right to Bottom-Left -->
    <path
      d="M776 50H748L688 176H716L776 50Z"
      fill="url(#wordmarkXGrad)"
    />
    <!-- Center Precision Fusion / Spark Highlight -->
    <circle cx="733" cy="113" r="5" fill="#38BDF8" opacity="0.6" />
  </g>
</svg>