name: SpendX Continuous Integration

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main
      - 'feat/**'

jobs:
  backend-ci:
    name: Backend CI (Lint, Typecheck, Test & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Code Linting
        run: npm run lint

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Run Vitest & Supertest Suite
        run: npm test

      - name: Build Backend Service
        run: npm run build

  frontend-ci:
    name: Frontend CI (Lint, Typecheck, Test & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Code Linting
        run: npm run lint

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Run Vitest & RTL Suite
        run: npm test

      - name: Build Frontend Application
        run: npm run build
